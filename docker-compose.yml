services:
  db:
    image: postgres:16-alpine
    container_name: nxtturn_db
    environment:
      POSTGRES_DB: ${DB_NAME:-community_portal}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass} 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: nxtturn_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BACKEND_BUILD_TARGET:-development}
    container_name: nxtturn_backend
    volumes:
      - ./Loopline:/app
      - ./mediafiles:/app/mediafiles
      - ./seed_media:/seed_media
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - IS_LOCAL=${IS_LOCAL:-True}
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-devpass}@db:5432/${DB_NAME:-community_portal}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-develop-stage}
    container_name: nxtturn_frontend
    volumes:
      - ./frontend:/app
      # CRITICAL: This anonymous volume protects Linux node_modules from Windows
      - /app/node_modules 
    ports:
      - "5173:5173"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL} 
      - VITE_WS_BASE_URL=${VITE_WS_BASE_URL}
    env_file:
      - .env
    depends_on:
      - backend

  cypress:
    image: cypress/included:13.17.0
    container_name: nxtturn_cypress
    # This service only runs when you call it with --profile test
    profiles: ["test"]
    working_dir: /e2e
    volumes:
      - ./frontend:/e2e
      - /e2e/node_modules # Protects Cypress Linux dependencies
    environment:
      # We point Cypress to the 'frontend' container name inside the Docker network
      - CYPRESS_BASE_URL=https://frontend:5173
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    env_file:
      - .env
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data: